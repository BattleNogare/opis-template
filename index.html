<!doctype html>
<html lang="de">
<head>

  <style>

    .card-head{display:flex;gap:.75rem;justify-content:space-between;align-items:flex-start;padding:1rem;border-bottom:1px solid rgba(34,92,56,.65)} .title{font-weight:800;color:#d9ffe5;font-size:1.04rem;line-height:1.35} .file{color:var(--muted);font-size:.9rem;margin-top:.25rem} .actions{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:flex-end}

</head>
<body>
  <header>

    <select id="fileFilter"><option value="all">Alle Dateien</option><option>install.ins</option><option>remove.ins</option><option>remove.inc.ins</option></select>
    <button class="primary" id="addBtn">+ Neue Gruppe</button>
    <button id="reloadBtn">Neu laden</button>

  <main>
    <section class="content">
      <div class="summary" id="summary"></div>
      <div id="list"></div>
    </section>
    <aside id="toc">

  </main>

        <div><label for="pattern">Musteraufbau</label><textarea id="pattern" rows="18" required></textarea></div>
      </div>
      <div class="dialog-actions"><button type="button" class="danger" id="deleteBtn">Löschen</button><div><button type="button" id="cancelBtn">Abbrechen</button><button class="primary" id="saveBtn">Speichern</button></div></div>
    </form>
  </dialog>

const $ = (id) => document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function slug(s){return String(s).toLowerCase().replace(/[^a-z0-9äöüß]+/gi,'-').replace(/^-|-$/g,'');}
function initClient(){ if(!SUPABASE_URL.includes('DEIN-PROJEKT') && !SUPABASE_ANON_KEY.includes('DEIN_')) client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
async function loadRows(){
  initClient();
  if(!client){ rows=[...fallbackRows]; render(); return; }
  const {data,error} = await client.from(TABLE_NAME).select('*').order('script_type').order('sort_order').order('section_name');
  if(error){ rows=[...fallbackRows]; render('Lokale Daten angezeigt'); return; }
  rows=data||[]; render('Bereit');
}
function filteredRows(){
  const q=$('search').value.trim().toLowerCase(); const f=$('fileFilter').value;
  return rows.filter(r=>{
    if(f!=='all' && r.script_type!==f) return false;
    if(!q) return true;
    return [r.section_name,r.script_type,r.pattern,(r.related_sections||[]).join(' ')].join('
').toLowerCase().includes(q);
  });
}
function render(msg=''){
  const data=filteredRows();
  const by={'install.ins':[], 'remove.ins':[], 'remove.inc.ins':[]}; data.forEach(r=>by[r.script_type]?.push(r));
  $('summary').innerHTML=`<span class="pill">${data.length} Gruppen</span><span class="pill">install.ins: ${by['install.ins'].length}</span><span class="pill">remove.ins: ${by['remove.ins'].length}</span><span class="pill">remove.inc.ins: ${by['remove.inc.ins'].length}</span>${msg?`<span class="pill">${esc(msg)}</span>`:''}`;
  let html=''; let toc='';
  for(const type of ['install.ins','remove.ins','remove.inc.ins']){
    if(!by[type].length) continue;
    const gid=slug(type); html+=`<h2 id="${gid}">${type}</h2>`; toc+=`<a href="#${gid}"><strong>${type}</strong></a>`;
    by[type].forEach((r,i)=>{
      const id=r.id || `local-${type}-${i}`; const aid=slug(type+'-'+r.section_name);
      toc+=`<a href="#${aid}">${esc(r.section_name)}</a>`;
      const chips=(r.related_sections||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('');
      html+=`<article class="card" id="${aid}"><div class="card-head"><div><div class="title">${esc(r.section_name)}</div><div class="file">${esc(r.script_type)}</div></div><div class="actions"><button onclick="copyPattern('${id}')">Kopieren</button><button onclick="openEditor('${id}')">Bearbeiten</button></div></div>${chips?`<div class="chips">${chips}</div>`:''}<pre>${esc(r.pattern)}</pre></article>`;
    });
  }
  $('list').innerHTML=html || '<div class="pill">Keine Treffer</div>'; $('tocBody').innerHTML=toc;
}
function getById(id){return rows.find(r=>(r.id||`local-${r.script_type}-${rows.indexOf(r)}`)===id);}
window.copyPattern=async(id)=>{const r=getById(id); if(r) await navigator.clipboard.writeText(r.pattern||'');};
window.openEditor=(id)=>{const r=getById(id); if(!r)return; $('dialogTitle').textContent='Gruppe bearbeiten'; $('rowId').value=r.id||''; $('sectionName').value=r.section_name||''; $('scriptType').value=r.script_type||'install.ins'; $('relatedSections').value=(r.related_sections||[]).join('
'); $('pattern').value=r.pattern||''; $('deleteBtn').classList.toggle('hidden', !r.id); $('editor').showModal();};
$('addBtn').onclick=()=>{$('dialogTitle').textContent='Neue Gruppe'; $('rowId').value=''; $('sectionName').value=''; $('scriptType').value='install.ins'; $('relatedSections').value=''; $('pattern').value=''; $('deleteBtn').classList.add('hidden'); $('editor').showModal();};
$('cancelBtn').onclick=()=>$('editor').close();
$('editForm').onsubmit=async(e)=>{
  e.preventDefault();
  const payload={section_name:$('sectionName').value.trim(), script_type:$('scriptType').value, related_sections:$('relatedSections').value.split(/
|,/).map(s=>s.trim()).filter(Boolean), pattern:$('pattern').value, sort_order:rows.length+1};
  if(!payload.related_sections.length) payload.related_sections=[payload.section_name];
  const id=$('rowId').value;
  if(client){
    const q=id ? client.from(TABLE_NAME).update(payload).eq('id',id) : client.from(TABLE_NAME).insert(payload);
    const {error}=await q; if(error){alert('Speichern fehlgeschlagen: '+error.message);return;}
    $('editor').close(); await loadRows();
  } else {
    if(id){const idx=rows.findIndex(r=>r.id===id); if(idx>=0) rows[idx]={...rows[idx],...payload};}
    else rows.unshift({...payload,id:'local-'+Date.now()});
    $('editor').close(); render('Lokal geändert');
  }
};
$('deleteBtn').onclick=async()=>{const id=$('rowId').value; if(!id||!confirm('Diese Gruppe löschen?'))return; if(client){const {error}=await client.from(TABLE_NAME).delete().eq('id',id); if(error){alert('Löschen fehlgeschlagen: '+error.message);return;} $('editor').close(); await loadRows();} };
$('search').addEventListener('input',()=>render()); $('fileFilter').addEventListener('change',()=>render()); $('reloadBtn').onclick=loadRows; $('tocToggle').onclick=()=>$('toc').classList.toggle('collapsed');
loadRows();
</script>
