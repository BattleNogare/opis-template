<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>opsi Musterübersicht</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #06120d;
      --panel: #0b1d15;
      --panel-2: #0f261b;
      --panel-3: #143422;
      --line: #24563a;
      --line-soft: rgba(68, 152, 103, .32);
      --text: #e8f6ee;
      --muted: #9ab8a6;
      --green: #39d98a;
      --green-2: #20b86b;
      --green-soft: rgba(57, 217, 138, .12);
      --danger: #ff6b6b;
      --danger-soft: rgba(255, 107, 107, .12);
      --shadow: 0 18px 60px rgba(0,0,0,.38);
      --radius: 18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(57, 217, 138, .14), transparent 34rem),
        radial-gradient(circle at 80% 20%, rgba(32, 184, 107, .08), transparent 30rem),
        var(--bg);
      min-height: 100vh;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .hidden { display: none !important; }

    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .login-card {
      width: min(460px, 100%);
      background: linear-gradient(180deg, rgba(15,38,27,.96), rgba(11,29,21,.96));
      border: 1px solid var(--line-soft);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .login-card h1 { margin: 0 0 8px; font-size: 28px; }
    .login-card p { margin: 0 0 24px; color: var(--muted); }

    .field { display: grid; gap: 8px; margin-bottom: 14px; }
    .field label { color: var(--muted); font-size: 13px; font-weight: 700; }
    .input, .select, .textarea {
      width: 100%;
      color: var(--text);
      background: #071710;
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      outline: none;
      padding: 12px 14px;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
    .textarea { min-height: 340px; resize: vertical; font-family: var(--mono); line-height: 1.45; }

    .btn {
      border: 1px solid var(--line-soft);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 14px;
      font-weight: 800;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--green); }
    .btn.primary { background: linear-gradient(135deg, var(--green-2), #107d4a); border-color: rgba(57,217,138,.55); color: #03110a; }
    .btn.danger { background: var(--danger-soft); border-color: rgba(255,107,107,.35); color: #ffd9d9; }
    .btn.ghost { background: transparent; }
    .btn.small { padding: 7px 10px; font-size: 12px; border-radius: 10px; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(16px);
      background: rgba(6,18,13,.78);
      border-bottom: 1px solid var(--line-soft);
    }
    .topbar-inner {
      display: grid;
      grid-template-columns: 1fr auto auto auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px 20px;
      margin-right: 330px;
    }

    .search-row { display: grid; grid-template-columns: minmax(180px, 1fr) 180px; gap: 12px; }
    .status { color: var(--muted); font-size: 13px; white-space: nowrap; }

    .layout { display: grid; grid-template-columns: 1fr 330px; }
    .main { padding: 24px 24px 60px; min-width: 0; }
    .intro {
      background: linear-gradient(180deg, rgba(15,38,27,.86), rgba(11,29,21,.86));
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
    }
    .intro h1 { margin: 0 0 8px; font-size: 30px; }
    .intro p { margin: 0; color: var(--muted); }

    .stats { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .pill {
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      background: rgba(57,217,138,.07);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .section-card {
      background: linear-gradient(180deg, rgba(15,38,27,.94), rgba(9,24,17,.94));
      border: 1px solid var(--line-soft);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.18);
      scroll-margin-top: 92px;
    }
    .section-card:target { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft), 0 10px 30px rgba(0,0,0,.18); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .card-title { margin: 0; font-size: 20px; line-height: 1.2; }
    .card-meta { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .card-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

    .calls { display:flex; flex-wrap:wrap; gap:8px; margin: 10px 0 12px; }
    .call-link, .code-link {
      border: 1px solid rgba(57,217,138,.35);
      color: #bbf7d0;
      background: rgba(57,217,138,.09);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
    }
    .call-link:hover, .code-link:hover { border-color: var(--green); background: rgba(57,217,138,.16); }

    .code {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #05120d;
      border: 1px solid rgba(68,152,103,.24);
      border-radius: 16px;
      padding: 14px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.45;
      color: #d8f8e5;
    }
    .code-link {
      display: inline;
      border-radius: 7px;
      padding: 1px 4px;
      font-family: var(--mono);
      font-size: inherit;
      border-style: dashed;
    }

    .toc {
      position: sticky;
      top: 0;
      height: 100vh;
      border-left: 1px solid var(--line-soft);
      background: rgba(7,23,16,.86);
      backdrop-filter: blur(18px);
      padding: 14px;
      overflow: auto;
      z-index: 30;
    }
    .toc.collapsed { width: 54px; padding: 14px 8px; overflow: hidden; }
    .toc.collapsed .toc-body, .toc.collapsed .toc-title span { display: none; }
    .toc-title { display:flex; align-items:center; justify-content:space-between; gap: 8px; margin-bottom: 12px; }
    .toc-title h2 { margin:0; font-size: 15px; }
    .toc-list { display:grid; gap: 6px; }
    .toc-link {
      display:block;
      color: var(--muted);
      text-decoration:none;
      font-size: 13px;
      padding: 8px 9px;
      border-radius: 10px;
      border: 1px solid transparent;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .toc-link:hover { color: var(--text); border-color: var(--line-soft); background: rgba(57,217,138,.08); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0,0,0,.68);
      display: grid;
      place-items: center;
      padding: 22px;
    }
    .modal {
      width: min(880px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .modal-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 16px; }
    .modal-head h2 { margin: 0; }
    .form-grid { display:grid; grid-template-columns: 1fr 180px 120px; gap: 12px; }
    .modal-actions { display:flex; justify-content:flex-end; gap: 10px; margin-top: 14px; }
    .history-list { display: grid; gap: 12px; }
    .history-item {
      border: 1px solid var(--line-soft);
      border-radius: 16px;
      background: rgba(57,217,138,.05);
      padding: 14px;
    }
    .history-head { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom: 8px; }
    .history-title { font-weight:900; }
    .history-meta { color: var(--muted); font-size: 12px; display:flex; gap:8px; flex-wrap:wrap; }
    .history-pre {
      margin: 10px 0 0;
      white-space: pre-wrap;
      overflow-wrap:anywhere;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.4;
      color: #d8f8e5;
      background: #05120d;
      border: 1px solid rgba(68,152,103,.24);
      border-radius: 12px;
      padding: 10px;
    }

    .toast {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 80;
      max-width: min(520px, calc(100vw - 40px));
      padding: 12px 14px;
      background: #0b1d15;
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      box-shadow: var(--shadow);
      color: var(--text);
    }
    .toast.error { border-color: rgba(255,107,107,.6); color: #ffd9d9; }

    @media (max-width: 1050px) {
      .layout { grid-template-columns: 1fr; }
      .topbar-inner { margin-right: 0; grid-template-columns: 1fr auto; }
      .status { display:none; }
      .toc { position: fixed; right: 0; top: 0; width: 310px; }
      .search-row { grid-column: 1 / -1; }
    }
    @media (max-width: 680px) {
      .topbar-inner { grid-template-columns: 1fr; }
      .search-row, .form-grid { grid-template-columns: 1fr; }
      .card-head { flex-direction: column; }
      .card-actions { justify-content: flex-start; }
      .main { padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="loginView" class="login-wrap">
    <form id="loginForm" class="login-card">
      <h1>opsi Musterübersicht</h1>
      <p>Bitte anmelden, um die Sektionen zu laden und zu bearbeiten.</p>
      <div class="field">
        <label for="usernameInput">Benutzername</label>
        <input id="usernameInput" class="input" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="passwordInput">Passwort</label>
        <input id="passwordInput" class="input" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn primary" type="submit" style="width:100%">Anmelden</button>
    </form>
  </div>

  <div id="appView" class="hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="search-row">
          <input id="searchInput" class="input" placeholder="Sektion oder Muster suchen ..." />
          <select id="typeFilter" class="select">
            <option value="all">Alle Dateien</option>
            <option value="install.ins">install.ins</option>
            <option value="remove.ins">remove.ins</option>
            <option value="remove.inc.ins">remove.inc.ins</option>
          </select>
        </div>
        <button id="newBtn" class="btn primary" type="button">+ Sektion</button>
        <button id="reloadBtn" class="btn" type="button">Neu laden</button>
        <button id="historyBtn" class="btn" type="button">History</button>
        <button id="logoutBtn" class="btn ghost" type="button">Abmelden</button>
        <div id="status" class="status">Bereit</div>
      </div>
    </header>

    <div class="layout">
      <main class="main">
        <section class="intro">
          <h1>opsi Musterübersicht</h1>
          <p>Einzelsektionen mit klickbaren Verbindungen zu aufgerufenen Sektionen.</p>
          <div id="stats" class="stats"></div>
        </section>
        <div id="content"></div>
      </main>

      <aside id="toc" class="toc">
        <div class="toc-title">
          <h2><span>Inhaltsverzeichnis</span></h2>
          <button id="tocToggle" class="btn small" type="button">⇔</button>
        </div>
        <div id="tocBody" class="toc-body">
          <div id="tocList" class="toc-list"></div>
        </div>
      </aside>
    </div>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <form id="editForm" class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">Sektion bearbeiten</h2>
        <button id="closeModalBtn" class="btn small" type="button">Schließen</button>
      </div>
      <input id="editId" type="hidden" />
      <div class="form-grid">
        <div class="field">
          <label for="editSectionName">Sektion</label>
          <input id="editSectionName" class="input" placeholder="[Sub_Beispiel]" required />
        </div>
        <div class="field">
          <label for="editScriptType">Datei</label>
          <select id="editScriptType" class="select" required>
            <option value="install.ins">install.ins</option>
            <option value="remove.ins">remove.ins</option>
            <option value="remove.inc.ins">remove.inc.ins</option>
          </select>
        </div>
        <div class="field">
          <label for="editSortOrder">Sortierung</label>
          <input id="editSortOrder" class="input" type="number" value="9999" />
        </div>
      </div>
      <div class="field">
        <label for="editPattern">Musteraufbau</label>
        <textarea id="editPattern" class="textarea" required></textarea>
      </div>
      <div class="modal-actions">
        <button id="deleteBtn" class="btn danger" type="button">Löschen</button>
        <button class="btn primary" type="submit">Speichern</button>
      </div>
    </form>
  </div>


  <div id="historyBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <section class="modal">
      <div class="modal-head">
        <h2>Änderungsverlauf</h2>
        <button id="closeHistoryBtn" class="btn small" type="button">Schließen</button>
      </div>
      <div id="historyList" class="history-list">
        <p class="status">History wird geladen ...</p>
      </div>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    const SUPABASE_URL = 'https://slhsztezkbrgmkuiiozc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsaHN6dGV6a2JyZ21rdWlpb3pjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MzMwNzYsImV4cCI6MjA5NDQwOTA3Nn0.rPfBxRJ53gf5-h5S4MwiQijlIg4BLpsXjRPvtIdQ-PE';

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const els = {
      loginView: document.getElementById('loginView'),
      appView: document.getElementById('appView'),
      loginForm: document.getElementById('loginForm'),
      usernameInput: document.getElementById('usernameInput'),
      passwordInput: document.getElementById('passwordInput'),
      searchInput: document.getElementById('searchInput'),
      typeFilter: document.getElementById('typeFilter'),
      newBtn: document.getElementById('newBtn'),
      reloadBtn: document.getElementById('reloadBtn'),
      historyBtn: document.getElementById('historyBtn'),
      logoutBtn: document.getElementById('logoutBtn'),
      status: document.getElementById('status'),
      stats: document.getElementById('stats'),
      content: document.getElementById('content'),
      toc: document.getElementById('toc'),
      tocToggle: document.getElementById('tocToggle'),
      tocList: document.getElementById('tocList'),
      modalBackdrop: document.getElementById('modalBackdrop'),
      editForm: document.getElementById('editForm'),
      modalTitle: document.getElementById('modalTitle'),
      closeModalBtn: document.getElementById('closeModalBtn'),
      editId: document.getElementById('editId'),
      editSectionName: document.getElementById('editSectionName'),
      editScriptType: document.getElementById('editScriptType'),
      editSortOrder: document.getElementById('editSortOrder'),
      editPattern: document.getElementById('editPattern'),
      deleteBtn: document.getElementById('deleteBtn'),
      historyBackdrop: document.getElementById('historyBackdrop'),
      closeHistoryBtn: document.getElementById('closeHistoryBtn'),
      historyList: document.getElementById('historyList'),
      toast: document.getElementById('toast')
    };

    let sections = [];
    let sessionToken = sessionStorage.getItem('opsi_session_token') || '';

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function cssId(id) {
      return 'sec-' + String(id).replace(/[^a-zA-Z0-9_-]/g, '-');
    }

    function sectionClean(name) {
      return String(name || '').replace(/^\[/, '').replace(/\]$/, '');
    }

    function setStatus(text) {
      els.status.textContent = text;
    }

    function showToast(message, isError = false) {
      els.toast.textContent = message;
      els.toast.classList.toggle('error', isError);
      els.toast.classList.remove('hidden');
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.add('hidden'), 4200);
    }

    function showApp(isLoggedIn) {
      els.loginView.classList.toggle('hidden', isLoggedIn);
      els.appView.classList.toggle('hidden', !isLoggedIn);
      if (!isLoggedIn) {
        sections = [];
        els.passwordInput.value = '';
        setTimeout(() => els.usernameInput.focus(), 30);
      }
    }

    async function login(username, password) {
      setStatus('Anmeldung ...');
      const { data, error } = await client.rpc('opsi_app_login', {
        p_username: username,
        p_password: password
      });
      if (error) throw error;
      if (!data || !data[0] || !data[0].token) throw new Error('Anmeldung fehlgeschlagen');
      sessionToken = data[0].token;
      sessionStorage.setItem('opsi_session_token', sessionToken);
      showApp(true);
      await loadSections();
    }

    async function logout() {
      if (sessionToken) {
        await client.rpc('opsi_app_logout', { p_token: sessionToken });
      }
      sessionToken = '';
      sessionStorage.removeItem('opsi_session_token');
      showApp(false);
    }

    async function loadSections() {
      if (!sessionToken) {
        showApp(false);
        return;
      }
      setStatus('Daten werden geladen ...');
      const { data, error } = await client.rpc('opsi_list_sections', { p_token: sessionToken });
      if (error) {
        if (String(error.message || '').toLowerCase().includes('angemeldet')) await logout();
        throw error;
      }
      sections = Array.isArray(data) ? data : [];
      setStatus('Geladen');
      render();
    }

    function filteredSections() {
      const q = els.searchInput.value.trim().toLowerCase();
      const type = els.typeFilter.value;
      return sections.filter(row => {
        const typeOk = type === 'all' || row.script_type === type;
        const text = `${row.section_name}\n${row.script_type}\n${row.pattern}\n${(row.called_sections || []).join(' ')}`.toLowerCase();
        return typeOk && (!q || text.includes(q));
      });
    }

    function findTarget(sectionName, scriptType) {
      const exact = sections.find(row => row.section_name === sectionName && row.script_type === scriptType);
      if (exact) return exact;
      return sections.find(row => row.section_name === sectionName) || null;
    }

    function jumpToSection(sectionName, scriptType) {
      const target = findTarget(sectionName, scriptType);
      if (!target) {
        showToast('Zielsektion nicht gefunden: ' + sectionName, true);
        return;
      }
      const element = document.getElementById(cssId(target.id));
      if (element) {
        element.scrollIntoView({ behavior: 'smooth', block: 'start' });
        history.replaceState(null, '', '#' + cssId(target.id));
      }
    }

    function renderPattern(row) {
      let html = escapeHtml(row.pattern || '');
      const calls = row.called_sections || [];
      calls
        .map(name => ({ full: name, clean: sectionClean(name) }))
        .sort((a, b) => b.clean.length - a.clean.length)
        .forEach(call => {
          const escapedClean = call.clean.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const regex = new RegExp('\\b' + escapedClean + '\\b', 'g');
          html = html.replace(regex, `<button class="code-link" type="button" data-jump="${escapeHtml(call.full)}" data-type="${escapeHtml(row.script_type)}">${escapeHtml(call.clean)}</button>`);
        });
      return html;
    }

    function renderStats(rows) {
      const counts = {
        'install.ins': sections.filter(r => r.script_type === 'install.ins').length,
        'remove.ins': sections.filter(r => r.script_type === 'remove.ins').length,
        'remove.inc.ins': sections.filter(r => r.script_type === 'remove.inc.ins').length
      };
      els.stats.innerHTML = `
        <span class="pill">Sichtbar: ${rows.length}</span>
        <span class="pill">install.ins: ${counts['install.ins']}</span>
        <span class="pill">remove.ins: ${counts['remove.ins']}</span>
        <span class="pill">remove.inc.ins: ${counts['remove.inc.ins']}</span>
      `;
    }

    function render() {
      const rows = filteredSections();
      renderStats(rows);
      els.content.innerHTML = rows.map(row => {
        const calls = (row.called_sections || []).map(call => {
          const target = findTarget(call, row.script_type);
          const href = target ? '#' + cssId(target.id) : '#';
          return `<a class="call-link" href="${href}" data-jump="${escapeHtml(call)}" data-type="${escapeHtml(row.script_type)}">${escapeHtml(call)}</a>`;
        }).join('');

        return `
          <article id="${cssId(row.id)}" class="section-card" data-id="${escapeHtml(row.id)}">
            <div class="card-head">
              <div>
                <h2 class="card-title">${escapeHtml(row.section_name)}</h2>
                <div class="card-meta">
                  <span class="pill">${escapeHtml(row.script_type)}</span>
                  <span class="pill">Aufrufe: ${(row.called_sections || []).length}</span>
                </div>
              </div>
              <div class="card-actions">
                <button class="btn small" type="button" data-copy="${escapeHtml(row.id)}">Kopieren</button>
                <button class="btn small" type="button" data-edit="${escapeHtml(row.id)}">Bearbeiten</button>
              </div>
            </div>
            ${calls ? `<div class="calls">${calls}</div>` : ''}
            <div class="code">${renderPattern(row)}</div>
          </article>
        `;
      }).join('') || '<section class="intro"><p>Keine passenden Sektionen gefunden.</p></section>';

      els.tocList.innerHTML = rows.map(row => `
        <a class="toc-link" href="#${cssId(row.id)}" title="${escapeHtml(row.section_name)}">
          ${escapeHtml(row.script_type)} · ${escapeHtml(row.section_name)}
        </a>
      `).join('');
    }

    function openEditor(row = null) {
      const isNew = !row;
      els.modalTitle.textContent = isNew ? 'Neue Sektion' : 'Sektion bearbeiten';
      els.editId.value = row?.id || '';
      els.editSectionName.value = row?.section_name || '[Neue_Sektion]';
      els.editScriptType.value = row?.script_type || (els.typeFilter.value === 'all' ? 'install.ins' : els.typeFilter.value);
      els.editSortOrder.value = row?.sort_order ?? 9999;
      els.editPattern.value = row?.pattern || '[Neue_Sektion]\n';
      els.deleteBtn.classList.toggle('hidden', isNew);
      els.modalBackdrop.classList.remove('hidden');
      setTimeout(() => els.editSectionName.focus(), 30);
    }

    function closeEditor() {
      els.modalBackdrop.classList.add('hidden');
    }

    async function saveEditor(event) {
      event.preventDefault();
      const id = els.editId.value;
      const payload = {
        p_token: sessionToken,
        p_section_name: els.editSectionName.value.trim(),
        p_script_type: els.editScriptType.value,
        p_pattern: els.editPattern.value,
        p_sort_order: Number(els.editSortOrder.value || 9999)
      };

      setStatus('Speichern ...');
      const { error } = id
        ? await client.rpc('opsi_update_section', { ...payload, p_id: id })
        : await client.rpc('opsi_create_section', payload);

      if (error) throw error;
      closeEditor();
      await loadSections();
      showToast('Gespeichert');
    }

    async function deleteCurrent() {
      const id = els.editId.value;
      if (!id) return;
      if (!confirm('Diese Sektion wirklich löschen?')) return;
      setStatus('Löschen ...');
      const { error } = await client.rpc('opsi_delete_section', { p_token: sessionToken, p_id: id });
      if (error) throw error;
      closeEditor();
      await loadSections();
      showToast('Gelöscht');
    }

    function formatDate(value) {
      if (!value) return '';
      try { return new Intl.DateTimeFormat('de-DE', { dateStyle: 'medium', timeStyle: 'medium' }).format(new Date(value)); }
      catch { return String(value); }
    }

    function summarizeHistory(row) {
      if (row.action === 'create') return 'neu angelegt';
      if (row.action === 'delete') return 'gelöscht';
      if (row.action === 'update') {
        const oldData = row.old_data || {};
        const newData = row.new_data || {};
        const changed = [];
        ['section_name', 'script_type', 'pattern', 'sort_order'].forEach(key => {
          if (JSON.stringify(oldData[key] ?? null) !== JSON.stringify(newData[key] ?? null)) changed.push(key);
        });
        return changed.length ? 'geändert: ' + changed.join(', ') : 'geändert';
      }
      return row.action || 'geändert';
    }

    async function openHistory() {
      els.historyBackdrop.classList.remove('hidden');
      els.historyList.innerHTML = '<p class="status">History wird geladen ...</p>';
      const { data, error } = await client.rpc('opsi_list_history', { p_token: sessionToken, p_limit: 200 });
      if (error) throw error;
      const rows = Array.isArray(data) ? data : [];
      els.historyList.innerHTML = rows.map(row => `
        <article class="history-item">
          <div class="history-head">
            <div>
              <div class="history-title">${escapeHtml(row.section_name || '[unbekannt]')}</div>
              <div class="history-meta">
                <span>${escapeHtml(row.script_type || '')}</span>
                <span>${escapeHtml(summarizeHistory(row))}</span>
              </div>
            </div>
            <div class="history-meta">
              <span>${escapeHtml(row.changed_by_username || 'unbekannt')}</span>
              <span>${escapeHtml(formatDate(row.created_at))}</span>
            </div>
          </div>
          <pre class="history-pre">${escapeHtml(JSON.stringify({ alt: row.old_data, neu: row.new_data }, null, 2))}</pre>
        </article>
      `).join('') || '<p class="status">Noch keine Änderungen protokolliert.</p>';
    }

    function closeHistory() {
      els.historyBackdrop.classList.add('hidden');
    }

    document.addEventListener('click', async event => {
      const jump = event.target.closest('[data-jump]');
      if (jump) {
        event.preventDefault();
        jumpToSection(jump.dataset.jump, jump.dataset.type);
        return;
      }

      const edit = event.target.closest('[data-edit]');
      if (edit) {
        const row = sections.find(item => item.id === edit.dataset.edit);
        if (row) openEditor(row);
        return;
      }

      const copy = event.target.closest('[data-copy]');
      if (copy) {
        const row = sections.find(item => item.id === copy.dataset.copy);
        if (row) {
          await navigator.clipboard.writeText(row.pattern || '');
          showToast('Muster kopiert');
        }
      }
    });

    els.loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      try {
        await login(els.usernameInput.value.trim(), els.passwordInput.value);
      } catch (error) {
        showToast(error.message || 'Anmeldung fehlgeschlagen', true);
        setStatus('Fehler');
      }
    });

    els.searchInput.addEventListener('input', render);
    els.typeFilter.addEventListener('change', render);
    els.newBtn.addEventListener('click', () => openEditor());
    els.reloadBtn.addEventListener('click', () => loadSections().catch(error => showToast(error.message, true)));
    els.historyBtn.addEventListener('click', () => openHistory().catch(error => showToast(error.message, true)));
    els.logoutBtn.addEventListener('click', () => logout().catch(() => showApp(false)));
    els.tocToggle.addEventListener('click', () => els.toc.classList.toggle('collapsed'));
    els.closeModalBtn.addEventListener('click', closeEditor);
    els.closeHistoryBtn.addEventListener('click', closeHistory);
    els.modalBackdrop.addEventListener('click', event => { if (event.target === els.modalBackdrop) closeEditor(); });
    els.historyBackdrop.addEventListener('click', event => { if (event.target === els.historyBackdrop) closeHistory(); });
    els.editForm.addEventListener('submit', event => saveEditor(event).catch(error => showToast(error.message, true)));
    els.deleteBtn.addEventListener('click', () => deleteCurrent().catch(error => showToast(error.message, true)));

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') { closeEditor(); closeHistory(); }
    });

    if (sessionToken) {
      showApp(true);
      loadSections().catch(error => {
        showToast(error.message || 'Laden fehlgeschlagen', true);
        logout().catch(() => showApp(false));
      });
    } else {
      showApp(false);
    }
  </script>
</body>
</html>
