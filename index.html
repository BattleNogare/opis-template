<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>opsi-Musterübersicht</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #07120c;
      --panel: #0c1f14;
      --panel-2: #102a1b;
      --panel-3: #143821;
      --text: #e9f7ee;
      --muted: #9bc3aa;
      --line: #225c38;
      --accent: #35d06f;
      --accent-2: #1fa957;
      --danger: #ff6b6b;
      --shadow: rgba(0,0,0,.35);
      --code: #051008;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top left, rgba(53,208,111,.12), transparent 34rem), var(--bg);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: .75rem;
      align-items: center;
      padding: 1rem;
      background: rgba(7,18,12,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .search { position: relative; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: .8rem;
      color: var(--text);
      background: #08180f;
      padding: .75rem .9rem;
      outline: none;
      font: inherit;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(53,208,111,.16); }
    button {
      border: 1px solid var(--line);
      border-radius: .8rem;
      background: var(--panel-2);
      color: var(--text);
      padding: .75rem 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); background: var(--panel-3); }
    button.primary { background: linear-gradient(135deg, var(--accent-2), #168f49); border-color: #46e486; color: #041007; }
    button.danger { color: #ffecec; border-color: rgba(255,107,107,.45); background: rgba(255,107,107,.10); }
    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 1rem;
      padding: 1rem;
    }
    .content { min-width: 0; }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      color: var(--muted);
      margin: .25rem 0 1rem;
      font-size: .95rem;
    }
    .pill {
      border: 1px solid var(--line);
      background: rgba(16,42,27,.78);
      padding: .35rem .65rem;
      border-radius: 999px;
    }
    .group-title {
      margin: 2rem 0 .75rem;
      color: #caffd9;
      font-size: 1.35rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: .45rem;
    }
    article.card {
      background: linear-gradient(180deg, rgba(16,42,27,.96), rgba(12,31,20,.96));
      border: 1px solid var(--line);
      border-radius: 1rem;
      margin: 0 0 1rem;
      box-shadow: 0 10px 30px var(--shadow);
      overflow: hidden;
    }
    .card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: .75rem;
      align-items: center;
      padding: 1rem;
      border-bottom: 1px solid rgba(34,92,56,.7);
    }
    .card h3 { margin: 0; font-size: 1.05rem; color: #d9ffe4; }
    .filetag { color: var(--muted); font-size: .88rem; margin-top: .25rem; }
    .actions { display: flex; gap: .45rem; flex-wrap: wrap; justify-content: end; }
    pre {
      margin: 0;
      padding: 1rem;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--code);
      color: #d9ffe4;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: .92rem;
      line-height: 1.45;
    }
    aside {
      position: sticky;
      top: 5.25rem;
      align-self: start;
      max-height: calc(100vh - 6.25rem);
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: rgba(12,31,20,.9);
      overflow: hidden;
      box-shadow: 0 10px 30px var(--shadow);
    }
    .toc-head { display: flex; justify-content: space-between; gap: .5rem; align-items: center; padding: .75rem; border-bottom: 1px solid var(--line); }
    .toc-body { max-height: calc(100vh - 10rem); overflow: auto; padding: .75rem; }
    .toc-body.collapsed { display: none; }
    .toc-section { color: #caffd9; font-weight: 800; margin: .75rem 0 .35rem; }
    .toc a { display: block; color: var(--muted); text-decoration: none; padding: .25rem 0; font-size: .9rem; }
    .toc a:hover { color: var(--accent); }
    dialog {
      width: min(880px, calc(100vw - 2rem));
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 0;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 24px 80px rgba(0,0,0,.55);
    }
    dialog::backdrop { background: rgba(0,0,0,.65); }
    .dialog-head, .dialog-foot { padding: 1rem; border-bottom: 1px solid var(--line); display: flex; gap: .5rem; justify-content: space-between; align-items: center; }
    .dialog-foot { border-bottom: 0; border-top: 1px solid var(--line); justify-content: end; }
    .dialog-body { padding: 1rem; display: grid; gap: .75rem; }
    textarea { min-height: 320px; font-family: Consolas, Monaco, "Courier New", monospace; line-height: 1.45; resize: vertical; }
    .hidden { display: none !important; }
    @media (max-width: 980px) {
      header { grid-template-columns: 1fr; }
      main { grid-template-columns: 1fr; }
      aside { position: static; max-height: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="search"><input id="searchInput" placeholder="Sektion oder Muster suchen ..." autocomplete="off"></div>
    <select id="typeFilter" aria-label="Dateityp filtern">
      <option value="all">Alle Dateien</option>
      <option value="install.ins">install.ins</option>
      <option value="remove.ins">remove.ins</option>
      <option value="remove.inc.ins">remove.inc.ins</option>
    </select>
    <button class="primary" id="addBtn">+ Neue Sektion</button>
    <button id="reloadBtn">Aktualisieren</button>
  </header>

  <main>
    <section class="content">
      <h1>opsi-Musterübersicht</h1>
      <div class="summary" id="summary"></div>
      <div id="list"></div>
    </section>
    <aside class="toc" aria-label="Inhaltsverzeichnis">
      <div class="toc-head">
        <strong>Inhalt</strong>
        <button id="tocToggle">Einklappen</button>
      </div>
      <div class="toc-body" id="tocBody"></div>
    </aside>
  </main>

  <dialog id="editorDialog">
    <form method="dialog">
      <div class="dialog-head">
        <strong id="dialogTitle">Sektion bearbeiten</strong>
        <button value="cancel">Schließen</button>
      </div>
      <div class="dialog-body">
        <label>Sektion
          <input id="editSection" placeholder="[Sub_Beispiel]">
        </label>
        <label>Datei
          <select id="editType">
            <option value="install.ins">install.ins</option>
            <option value="remove.ins">remove.ins</option>
            <option value="remove.inc.ins">remove.inc.ins</option>
          </select>
        </label>
        <label>Musteraufbau
          <textarea id="editPattern" spellcheck="false"></textarea>
        </label>
      </div>
      <div class="dialog-foot">
        <button value="cancel">Abbrechen</button>
        <button class="primary" id="saveBtn" value="default">Speichern</button>
      </div>
    </form>
  </dialog>

    const api = window.supabase.createClient(DATA_URL, DATA_PUBLIC_KEY);
    const order = ['install.ins', 'remove.ins', 'remove.inc.ins'];
    let entries = [];
    let currentId = null;

    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (ch) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const slug = (value) => String(value).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

    async function loadData() {
      $('summary').innerHTML = '<span class="pill">Daten werden geladen ...</span>';
      const { data, error } = await api
        .from(TABLE_NAME)
        .select('id, section_name, script_type, pattern, sort_order')
        .order('script_type', { ascending: true })
        .order('sort_order', { ascending: true });

      if (error) {
        entries = FALLBACK_DATA.map((x, i) => ({...x, id: `fallback-${i}`}));
        render('Lokale Ansicht');
        return;
      }
      entries = data || [];
      render('Bereit');
    }

    function filteredEntries() {
      const q = $('searchInput').value.trim().toLowerCase();
      const type = $('typeFilter').value;
      return entries.filter((item) => {
        const typeOk = type === 'all' || item.script_type === type;
        const text = `${item.section_name}\n${item.script_type}\n${item.pattern}`.toLowerCase();
        return typeOk && (!q || text.includes(q));
      });
    }

    function render(statusText = 'Bereit') {
      const data = filteredEntries();
      const counts = Object.fromEntries(order.map(t => [t, data.filter(x => x.script_type === t).length]));
      $('summary').innerHTML = `
        <span class="pill">${escapeHtml(statusText)}</span>
        <span class="pill">${data.length} Einträge</span>
        <span class="pill">install.ins: ${counts['install.ins']}</span>
        <span class="pill">remove.ins: ${counts['remove.ins']}</span>
        <span class="pill">remove.inc.ins: ${counts['remove.inc.ins']}</span>
      `;

      const groups = order.map(type => [type, data.filter(x => x.script_type === type)]).filter(([,items]) => items.length);
      $('list').innerHTML = groups.map(([type, items]) => `
        <h2 class="group-title" id="group-${slug(type)}">${escapeHtml(type)}</h2>
        ${items.map(cardHtml).join('')}
      `).join('') || '<article class="card"><pre>Keine Einträge gefunden.</pre></article>';

      $('tocBody').innerHTML = groups.map(([type, items]) => `
        <div class="toc-section">${escapeHtml(type)}</div>
        ${items.map(item => `<a href="#${entryDomId(item)}">${escapeHtml(item.section_name)}</a>`).join('')}
      `).join('');
    }

    function entryDomId(item) {
      return `entry-${slug(item.script_type)}-${slug(item.section_name)}-${String(item.id).slice(0,8)}`;
    }

    function cardHtml(item) {
      return `
        <article class="card" id="${entryDomId(item)}">
          <div class="card-head">
            <div>
              <h3>${escapeHtml(item.section_name)}</h3>
              <div class="filetag">${escapeHtml(item.script_type)}</div>
            </div>
            <div class="actions">
              <button onclick="copyPattern('${item.id}')">Kopieren</button>
              <button onclick="openEditor('${item.id}')">Bearbeiten</button>
              <button class="danger" onclick="deleteEntry('${item.id}')">Löschen</button>
            </div>
          </div>
          <pre>${escapeHtml(item.pattern)}</pre>
        </article>
      `;
    }

    function openEditor(id = null) {
      currentId = id;
      const item = id ? entries.find(x => String(x.id) === String(id)) : null;
      $('dialogTitle').textContent = item ? 'Sektion bearbeiten' : 'Neue Sektion';
      $('editSection').value = item?.section_name || '';
      $('editType').value = item?.script_type || 'install.ins';
      $('editPattern').value = item?.pattern || '';
      $('editorDialog').showModal();
    }

    async function saveEntry(ev) {
      ev.preventDefault();
      const payload = {
        section_name: $('editSection').value.trim(),
        script_type: $('editType').value,
        pattern: $('editPattern').value.trim(),
        sort_order: entries.length + 1
      };
      if (!payload.section_name) return;

      let result;
      if (currentId && !String(currentId).startsWith('fallback-')) {
        result = await api.from(TABLE_NAME).update(payload).eq('id', currentId).select().single();
      } else {
        result = await api.from(TABLE_NAME).insert(payload).select().single();
      }
      if (result.error) {
        alert('Speichern nicht möglich.');
        return;
      }
      $('editorDialog').close();
      await loadData();
    }

    async function deleteEntry(id) {
      if (!confirm('Diesen Eintrag löschen?')) return;
      if (String(id).startsWith('fallback-')) return;
      const { error } = await api.from(TABLE_NAME).delete().eq('id', id);
      if (error) {
        alert('Löschen nicht möglich.');
        return;
      }
      await loadData();
    }

    async function copyPattern(id) {
      const item = entries.find(x => String(x.id) === String(id));
      if (!item) return;
      await navigator.clipboard.writeText(item.pattern || '');
      render('Kopiert');
    }

    $('searchInput').addEventListener('input', () => render());
    $('typeFilter').addEventListener('change', () => render());
    $('reloadBtn').addEventListener('click', loadData);
    $('addBtn').addEventListener('click', () => openEditor(null));
    $('saveBtn').addEventListener('click', saveEntry);
    $('tocToggle').addEventListener('click', () => {
      $('tocBody').classList.toggle('collapsed');
      $('tocToggle').textContent = $('tocBody').classList.contains('collapsed') ? 'Ausklappen' : 'Einklappen';
    });

    window.openEditor = openEditor;
    window.deleteEntry = deleteEntry;
    window.copyPattern = copyPattern;

    loadData();
  </script>
